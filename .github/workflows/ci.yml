name: CI

on:
  push:
    branches: ["main", "claude/**"]
    paths-ignore: ["android/**", ".github/workflows/android.yml", "**.md"]
  pull_request:
    paths-ignore: ["android/**", "**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Core unit tests
        run: swift test

      - name: Build app for iOS Simulator
        run: |
          xcodebuild build \
            -project Grosh.xcodeproj \
            -scheme Grosh \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || {
              grep -E "error:|error " build.log | sort -u | head -80
              tail -25 build.log
              exit 1
            }
          tail -3 build.log
